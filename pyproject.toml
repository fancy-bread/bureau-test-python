[project]
name = "bureau-test"
version = "0.1.0"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pre-commit>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
