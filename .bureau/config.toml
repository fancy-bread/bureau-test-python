[runtime]
language    = "python"
base_image  = "python:3.14-slim"
install_cmd = "pip install -e '.[dev]'"
lint_cmd    = "ruff check ."
build_cmd   = ""
test_cmd    = "pytest"

[ralph_loop]
max_builder_attempts = 3
max_rounds           = 3
command_timeout      = 300

[bureau]
builder_model   = "claude-sonnet-4-6"
reviewer_model  = "claude-opus-4-7"
